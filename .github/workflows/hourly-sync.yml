name: Hourly reporting sync

# Reliable hourly trigger for the metrics rollup (ad spend, COGS), the
# commission ledger and the HST cost sync. These already run from the Cloudflare
# Worker's own cron ("0 * * * *" in wrangler.jsonc), but that schedule has proven
# unreliable in practice — whole nights pass with no refresh, so ad spend and
# COGS drift hours stale. This fires the SAME endpoints on a schedule that does.
#
# It is safe alongside the Worker cron: every endpoint is idempotent, and the
# reporting route skips, for machine calls only, every store whose three
# snapshot families (funnel, campaign performance, collection sales) for that
# range succeeded within the last 20 minutes with no failure recorded since.
# So if the Worker cron DID run at :00, this :07 run finds those stores fresh
# and reads nothing from Shopify or Google for them; a store that failed or
# was cut by the route budget at :00 is retried here. The portfolio Google
# leg, the metrics rollup and the ledger have no such gate and run each time.
#
# GitHub queues scheduled runs hours late under load: on 14 and 15 Sep 2026
# the ":07" runs actually started at 06:03, 12:33, 18:31, 22:24, 01:21 and
# 07:36, gaps of 3 to 6 hours in which today's ad spend sat at whatever the
# last landed run wrote. Two attempts an hour raise the odds of one landing
# inside any given hour. The second attempt is not cheap when the first did
# land: the store gate above is 20 minutes, so a run at :37 finds every
# store's snapshots 30 minutes old or more and reads them all again from
# Shopify and Google, and the portfolio Google leg, the metrics rollup and
# the ledger run ungated either way. On an hour where :00 or :07 landed this
# is a second full refresh; that load is accepted for the hours where neither
# did. If Shopify throttles start cutting refreshes short, widen
# STORE_FRESHNESS_WINDOW_MS in src/app/api/admin/sync-reporting/route.ts past
# 30 minutes so the :37 run skips the stores the :00 or :07 run refreshed.
# The legs run d7 -> d30 -> today, the same order as the Worker cron, and
# the order matters: every leg upserts today's daily_metrics row, and the
# today leg reads it from a different Windsor feed than the rolling legs, so
# the last leg decides the ad spend clients see today. Do not reorder them.
#
# This is NOT the deploy path — deployment stays on Cloudflare Workers Builds.
#
# Setup (one time):
#   1. Repository secret CRON_SECRET — the SAME value as the Worker's CRON_SECRET
#      (the endpoints authorize on `Authorization: Bearer <CRON_SECRET>`). If the
#      Worker has none set, set it there too: `wrangler secret put CRON_SECRET`.
#   2. Optional repository variable SITE_URL if production is not
#      https://dropscale.app.

on:
  schedule:
    - cron: "7 * * * *" # hourly, offset from the Worker's :00
    - cron: "37 * * * *" # second attempt: GitHub queues one late, the other may land
  workflow_dispatch: {}

concurrency:
  group: hourly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reporting, ledger and HST sync
        env:
          BASE: ${{ vars.SITE_URL || 'https://dropscale.app' }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::CRON_SECRET repository secret is not set — skipping. Add it (matching the Worker's CRON_SECRET) to enable the hourly sync."
            exit 0
          fi

          fail=0
          portfolio_missed=0
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          for path in \
            "api/admin/sync-reporting?range=d7" \
            "api/admin/sync-reporting?range=d30" \
            "api/admin/sync-reporting?range=today" \
            "api/admin/sync-ledgers"; do
            echo "POST /$path"
            # Retry an interrupted connection once, before advancing to the
            # next leg. These refreshes are idempotent; today must still run
            # after both history ranges. HTTP failures keep their real status.
            for attempt in 1 2; do
              : > "$body"
              transport=0
              code=$(curl -sS -o "$body" -w "%{http_code}" -X POST "$BASE/$path" \
                -H "Authorization: Bearer $SECRET" \
                -H "Content-Type: application/json" \
                --max-time 200) || transport=$?
              if [ "$transport" -eq 0 ]; then
                break
              fi
              # A transport failure can leave headers or half a JSON body.
              # Neither is evidence that the refresh finished successfully.
              code=000
              : > "$body"
              case "$transport" in
                5 | 6 | 7 | 18 | 28 | 35 | 52 | 55 | 56 | 92)
                  if [ "$attempt" -eq 1 ]; then
                    echo "::warning::/$path connection interrupted (curl $transport); retrying once in 10 seconds."
                    sleep 10
                    continue
                  fi ;;
              esac
              break
            done
            echo "  status=$code"
            head -c 400 "$body" 2>/dev/null || true
            echo
            case "$code" in
              200) ;;
              # 502 = partial refresh (budget/provider): it did work, but not
              # all of it, so the run stays green. It is annotated all the same,
              # because a green run with no trace is how a permanently broken
              # account goes unnoticed for weeks. From sync-ledgers a 502 also
              # means every step behind the commission ledger — revenue share,
              # HST commission, supplier COGS, the daily rollup and the referral
              # cache — was skipped this hour.
              502)
                echo "::warning::/$path returned 502 — partial refresh. The body above names what did not update; repeated hours mean something is broken, not slow."
                # The portfolio phase writes every Google account's metrics and
                # the campaign sheet in one pass. This signature is the route
                # giving up on WAITING for it, not the phase failing: the work
                # is not confirmed either way. One leg missing it is noise; all
                # three legs of a run missing it is how today's ad spend read
                # €0 for every client until noon on 2026-09-19, three weeks
                # into a run of green jobs.
                case "$path" in
                  api/admin/sync-reporting*)
                    if grep -q '"accounts":0,"metricCoverage":null' "$body"; then
                      echo "::warning::/$path — the portfolio phase did not confirm within its deadline; this leg wrote no account metrics that it can vouch for."
                      portfolio_missed=$((portfolio_missed + 1))
                    fi ;;
                esac ;;
              401 | 403) echo "::error::/$path was rejected ($code) — CRON_SECRET does not match the Worker's."; fail=1 ;;
              *) echo "::warning::/$path returned $code"; fail=1 ;;
            esac
          done
          # Three reporting legs, none of which confirmed the portfolio phase:
          # nothing this run can vouch for today's ad spend. That is the one
          # 502 that must go red, because from 26 Aug to 19 Sep 2026 it was
          # the normal hour and every job stayed green.
          if [ "$portfolio_missed" -ge 3 ]; then
            echo "::error::No reporting leg confirmed the portfolio phase this run — today's ad spend has no writer that answered. If the next run says the same, the phase is not slow, it is broken."
            fail=1
          fi
          exit $fail
